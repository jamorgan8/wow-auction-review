name: Build and release

# Tests run on every push and pull request.
# Pushing a version tag (e.g. v1.0.0) also builds AuctionReview.exe and publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(python -c "import auction_review; print(auction_review.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match auction_review.__version__ ($version)"; exit 1
          fi

      - name: Build exe
        run: |
          python -m pip install pyinstaller==6.11.1
          python packaging/build_exe.py

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="AuctionReview-${GITHUB_REF_NAME#v}-windows.zip"
          sha=$(sha256sum "dist/$zip" | cut -d' ' -f1)
          cat > notes.md <<EOF
          Download **$zip**, unzip it, and double-click AuctionReview.exe. See QUICKSTART.txt inside the zip.

          Windows may warn that the app is unrecognized because it isn't code-signed: click *More info* → *Run anyway*.
          Some antivirus tools also flag unsigned Python-built apps by mistake. To confirm your download is the file
          this workflow built, check its SHA-256 in PowerShell or Command Prompt:

              certutil -hashfile $zip SHA256

          It should print:

              $sha

          Prefer not to run an exe? Install with Python instead: \`pipx install git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}\`
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/$zip" --title "Auction Review $GITHUB_REF_NAME" --notes-file notes.md
