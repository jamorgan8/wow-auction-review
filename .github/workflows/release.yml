name: Build and release

# Tests run on every push and pull request.
# Pushing a version tag (e.g. v1.0.0) also builds AuctionReview.exe and publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(python -c "import auction_review; print(auction_review.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match auction_review.__version__ ($version)"; exit 1
          fi

      - name: Build exe
        run: |
          python -m pip install pyinstaller==6.11.1
          python packaging/build_exe.py

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AuctionReview-*-windows.zip \
            --title "Auction Review $GITHUB_REF_NAME" \
            --notes "Download **AuctionReview-${GITHUB_REF_NAME#v}-windows.zip**, unzip it, and double-click AuctionReview.exe. See QUICKSTART.txt inside the zip.

          Windows may warn that the app is unrecognized because it isn't code-signed: click *More info* → *Run anyway*."
